<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Код подтверждения — myelon.tj</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/app.js" defer></script>
    <style>
      .verify-card { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
      .verify-header { text-align: center; margin-bottom: 32px; }
      .verify-header .verify-icon { font-size: 48px; margin-bottom: 12px; }
      .verify-header h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 8px 0; }
      .verify-header p { font-size: 14px; color: #64748b; margin: 0; }
      .verify-phone { font-size: 16px; font-weight: 600; color: #0f172a; text-align: center; margin: 4px 0 0 0; }
      .code-inputs { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
      .code-input { width: 44px; height: 52px; text-align: center; font-size: 20px; font-weight: 600; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; outline: none; transition: all 0.2s; }
      .code-input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
      .code-input.filled { background: #fff7ed; border-color: #f97316; }
      .verify-btn { width: 100%; background: #f97316; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
      .verify-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
      .resend-link { display: block; text-align: center; color: #f97316; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; }
      .resend-link:hover { text-decoration: underline; }
      .resend-timer { color: #94a3b8; font-size: 14px; text-align: center; }
      .method-badge { display: inline-block; background: #f1f5f9; color: #475569; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; margin-top: 4px; }
      .email-step { display: none; }
      .email-step.active { display: block; }
      .email-header { text-align: center; margin-bottom: 32px; }
      .email-header .email-icon { font-size: 48px; margin-bottom: 12px; }
      .email-header h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 8px 0; }
      .email-header p { font-size: 14px; color: #64748b; margin: 0; }
      .email-form label { display: grid; gap: 8px; font-weight: 600; font-size: 14px; }
      .email-form input { width: 100%; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px 14px; background: #fff; font-size: 15px; }
      .email-form .primary-btn { width: 100%; margin: 16px 0; }
      .seller-link { display: block; text-align: center; color: #f97316; font-size: 14px; font-weight: 500; text-decoration: none; margin-top: 12px; }
      .seller-link:hover { text-decoration: underline; }
      .skip-link { display: block; text-align: center; color: #94a3b8; font-size: 14px; font-weight: 500; text-decoration: none; margin-top: 8px; }
      .skip-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="page-shell auth-shell">
      <header class="topbar compact-topbar">
        <a class="back-button" href="login.html" title="Назад">←</a>
        <a class="brand" href="index.html" aria-label="myelon.tj home">
          <span class="brand-mark">E</span>
          <span class="brand-text"><strong>myelon.tj</strong><small>Верификация</small></span>
        </a>
      </header>

      <main class="verify-card">
        <!-- Code verification step -->
        <div id="codeStep">
          <div class="verify-header">
            <div class="verify-icon">🔐</div>
            <h1>Введите код подтверждения</h1>
            <p>Код отправлен на ваш номер</p>
            <div class="verify-phone">+992 99 123 4567</div>
            <span class="method-badge">SMS</span>
          </div>
          <form id="verifyForm">
            <div class="code-inputs">
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" />
            </div>
            <button type="submit" class="verify-btn" id="verifyBtn" disabled>Подтвердить</button>
            <div id="resendSection">
              <span class="resend-timer" id="resendTimer">Повторить через 0:45</span>
              <a href="#" class="resend-link" id="resendLink" style="display: none;">Отправить код повторно</a>
            </div>
          </form>
        </div>

        <!-- Email collection step (shown after code verification) -->
        <div id="emailStep" class="email-step">
          <div class="email-header">
            <div class="email-icon">📧</div>
            <h1>Почти готово!</h1>
            <p>Оставьте email для уведомлений (необязательно)</p>
          </div>
          <form id="emailForm">
            <label for="emailInput">Email для уведомлений
              <input type="email" id="emailInput" placeholder="example@mail.com" />
            </label>
            <button type="submit" class="primary-btn">Продолжить</button>
          </form>
          <a href="profile.html" class="skip-link">Пропустить →</a>
          <a href="seller-kyc.html" class="seller-link">Стать продавцом →</a>
        </div>
      </main>
    </div>

    <script>
      const inputs = document.querySelectorAll('.code-input');
      const verifyBtn = document.getElementById('verifyBtn');
      const resendTimer = document.getElementById('resendTimer');
      const resendLink = document.getElementById('resendLink');
      const codeStep = document.getElementById('codeStep');
      const emailStep = document.getElementById('emailStep');
      let timeLeft = 45;
      let timerId;

      inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
          if (input.value.length === 1) {
            input.classList.add('filled');
          } else {
            input.classList.remove('filled');
          }
          checkAllFilled();
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
            inputs[index - 1].classList.remove('filled');
            checkAllFilled();
          }
        });
      });

      function checkAllFilled() {
        const allFilled = Array.from(inputs).every(input => input.value.length === 1);
        verifyBtn.disabled = !allFilled;
      }

      function startTimer() {
        timeLeft = 45;
        resendTimer.style.display = 'block';
        resendLink.style.display = 'none';
        timerId = setInterval(() => {
          timeLeft--;
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          resendTimer.textContent = `Повторить через ${minutes}:${seconds.toString().padStart(2, '0')}`;
          if (timeLeft <= 0) {
            clearInterval(timerId);
            resendTimer.style.display = 'none';
            resendLink.style.display = 'block';
          }
        }, 1000);
      }

      resendLink.addEventListener('click', (e) => {
        e.preventDefault();
        startTimer();
      });

      document.getElementById('verifyForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const code = Array.from(inputs).map(input => input.value).join('');
        if (code.length === 6) {
          codeStep.style.display = 'none';
          emailStep.classList.add('active');
        }
      });

      document.getElementById('emailForm').addEventListener('submit', (e) => {
        e.preventDefault();
        window.location.href = 'profile.html';
      });

      startTimer();
    </script>
  </body>
</html>
