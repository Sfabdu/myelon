<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | MyElon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #F9FAFB; padding-bottom: 90px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .profile-container { max-width: 600px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
        
        /* Карточка пользователя */
        .user-card { background: #FFFFFF; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .user-info { display: flex; align-items: center; gap: 16px; }
        .user-avatar { width: 60px; height: 60px; background-color: #FF6600; color: #FFFFFF; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: 700; }
        .user-meta h3 { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; color: #111827; }
        .user-meta p { margin: 0; font-size: 14px; color: #6B7280; }
        
        /* Кнопка Выхода */
        .btn-logout { background: none; border: 1px solid #E5E7EB; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #EF4444; cursor: pointer; transition: all 0.2s ease; }
        .btn-logout:active { background-color: #FEF2F2; }
        
        /* Раздел объявлений */
        .my-items-section { margin-top: 32px; }
        .my-items-section h4 { font-size: 16px; font-weight: 800; color: #111827; margin: 0 0 16px 0; }
        .empty-box { background: #FFFFFF; border-radius: 20px; padding: 40px 20px; text-align: center; border: 1px dashed #E5E7EB; color: #9CA3AF; font-size: 14px; }
    </style>
</head>
<body>

<div class="profile-container">
    <!-- Шапка кабинета -->
    <div style="margin-bottom: 24px;">
        <h2 style="margin: 0; font-size: 24px; font-weight: 900; color: #111827;">Мой профиль</h2>
    </div>

    <!-- Карточка юзера -->
    <div class="user-card">
        <div class="user-info">
            <div class="user-avatar" id="user-letter">U</div>
            <div class="user-meta">
                <h3 id="profile-name">Загрузка...</h3>
                <p id="profile-email">email@example.com</p>
            </div>
        </div>
        <!-- Кнопка выйти напрочь стирает сессию -->
        <button class="btn-logout" onclick="handleLogout()">Выйти</button>
    </div>

    <!-- Список моих объявлений (заготовка под Supabase) -->
    <div class="my-items-section">
        <h4>Мои объявления</h4>
        <div class="empty-box">
            <span style="font-size: 32px; display: block; margin-bottom: 8px;">📦</span>
            У вас пока нет активных объявлений.<br>Нажмите «Создать» ➕, чтобы добавить первое!
        </div>
    </div>
</div>

<!-- Стабильное нижнее меню навигации (5 кнопок) -->
<div class="nav-bar">
    <a href="index.html" class="nav-item">
        <div class="nav-icon">🏠</div>
        <div>Главная</div>
    </a>
    <a href="categories.html" class="nav-item">
        <div class="nav-icon">📁</div>
        <div>Категории</div>
    </a>
    <a href="add-item.html" class="nav-item nav-add-btn">
        <div class="nav-icon">➕</div>
        <div>Создать</div>
    </a>
    <a href="chat.html" class="nav-item">
        <div class="nav-icon">💬</div>
        <div>Чат</div>
    </a>
    <a href="#" class="nav-item active" onclick="openMyProfile()">
        <div class="nav-icon">👤</div>
        <div>Профиль</div>
    </a>
</div>

<script>
// Автоматически вытаскиваем данные вошедшего пользователя из памяти телефона
document.addEventListener("DOMContentLoaded", function() {
    let isLoggedIn = localStorage.getItem('isLoggedIn');
    
    // Если паче чаяния юзер не вошел, а забрел сюда — гоним его на авторизацию
    if (isLoggedIn !== 'true') {
        window.location.href = 'auth.html';
        return;
    }
    
    let email = localStorage.getItem('userEmail') || 'Не указан';
    let name = localStorage.getItem('userName') || email.split('@')[0];
    
    // Вставляем данные на экран
    document.getElementById('profile-name').innerText = name;
    document.getElementById('profile-email').innerText = email;
    document.getElementById('user-letter').innerText = name.charAt(0).toUpperCase();
});

// Умная кнопка профиля для нижнего меню
function openMyProfile() {
    let isLoggedIn = localStorage.getItem('isLoggedIn');
    if (isLoggedIn === 'true') {
        window.location.href = 'profile.html';
    } else {
        window.location.href = 'auth.html';
    }
}

// Функция выхода: очищает память и перекидывает на главную
function handleLogout() {
    localStorage.clear();
    alert('Вы вышли из профиля.');
    window.location.href = 'index.html';
}
</script>

</body>
</html>
