<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | MyElon</title>
    <link rel="stylesheet" href="style.css">
    <script src="supabase.js"></script>
    <style>
        body { background-color: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* Главный контейнер смартфона */
        .main-container { width: 100%; max-width: 480px; background: #F9FAFB; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-sizing: border-box; padding-bottom: 80px; }
        
        /* Верхняя премиальная шапка профиля */
        .profile-header-card { background: #FFFFFF; border-bottom: 1px solid #E5E7EB; padding: 24px 16px; box-sizing: border-box; }
        .user-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .user-info-left { display: flex; align-items: center; gap: 16px; }
        
        /* Аватарка с верифицированной галочкой */
        .avatar-wrapper { position: relative; }
        .avatar-circle { width: 64px; height: 64px; background: #FF6600; color: #FFFFFF; font-weight: 800; font-size: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,102,0,0.2); }
        .verified-badge { position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: #25D366; color: white; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; font-weight: bold; }
        
        .user-text-box { text-align: left; }
        .user-name-title { font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .user-meta-sub { font-size: 13px; color: #6B7280; font-weight: 500; }
        
        .btn-logout-top { background: #F3F4F6; color: #EF4444; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-logout-top:active { transform: scale(0.97); background: #FEE2E2; }
        
        /* Блок кошелька и рейтинга (Из Uzum и Kaspi) */
        .stats-grid-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card-item { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 16px; padding: 14px; text-align: left; box-sizing: border-box; }
        .stat-label { font-size: 12px; color: #6B7280; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 16px; font-weight: 800; color: #111827; display: flex; align-items: center; gap: 4px; }
        
        /* Быстрые действия круглыми иконками */
        .quick-actions-row { display: flex; justify-content: space-around; background: #FFFFFF; padding: 16px; border-bottom: 1px solid #E5E7EB; box-sizing: border-box; }
        .action-circle-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; width: 70px; }
        .icon-circle-bg { width: 46px; height: 46px; background: #FFF0E6; color: #FF6600; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; }
        .action-circle-btn:active .icon-circle-bg { background: #FF6600; color: #FFFFFF; }
        .action-btn-text { font-size: 12px; font-weight: 700; color: #374151; }
        
        /* Табы объявлений (Из Авито) */
        .tabs-container-row { display: flex; background: #FFFFFF; padding: 4px 16px; border-bottom: 1px solid #E5E7EB; box-sizing: border-box; gap: 16px; }
        .tab-item-link { font-size: 15px; font-weight: 700; color: #6B7280; padding: 12px 4px; cursor: pointer; position: relative; border: none; background: none; }
        .tab-item-link.tab-active { color: #FF6600; }
        .tab-item-link.tab-active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #FF6600; border-radius: 3px 3px 0 0; }
        
        /* Секция списка объявлений */
        .ads-content-section { flex: 1; padding: 24px 16px; box-sizing: border-box; }
        .empty-ads-box { text-align: center; padding: 40px 16px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 20px; box-sizing: border-box; }
        .empty-box-icon { width: 54px; height: 54px; background: #F3F4F6; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px auto; }
        .empty-title { font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 6px; }
        .empty-desc { font-size: 13px; color: #6B7280; line-height: 1.4; margin-bottom: 20px; }
        
        .btn-create-ad-orange { background: #FF6600; color: #FFFFFF; border: none; padding: 12px 24px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(255,102,0,0.15); }
        
        /* Нижнее меню навигации */
        .bottom-nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #FFFFFF; border-top: 1px solid #E5E7EB; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 0; box-sizing: border-box; z-index: 999; }
        .nav-item-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; color: #9CA3AF; text-decoration: none; font-size: 11px; font-weight: 600; }
        .nav-item-btn.nav-active { color: #FF6600; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

<div class="main-container">
    
    <!-- Карточка профиля -->
    <div class="profile-header-card">
        <div class="user-row">
            <div class="user-info-left">
                <div class="avatar-wrapper">
                    <div id="user-avatar-letter" class="avatar-circle">A</div>
                    <div class="verified-badge">✓</div>
                </div>
                <div class="user-text-box">
                    <div id="user-name-display" class="user-name-title">Загрузка...</div>
                    <div id="user-id-display" class="user-meta-sub">ID 000000</div>
                </div>
            </div>
            <button class="btn-logout-top" onclick="handleLogoutUser()">Выйти</button>
        </div>
        
        <!-- Блок кошелька и рейтинга -->
        <div class="stats-grid-box">
            <div class="stat-card-item">
                <div class="stat-label">Мой Баланс</div>
                <div class="stat-value" style="color: #25D366;">0.00 c.</div>
            </div>
            <div class="stat-card-item">
                <div class="stat-label">Мой Рейтинг</div>
                <div class="stat-value" style="color: #FFB000;">5.0 <span style="font-size:13px;">⭐️</span></div>
            </div>
        </div>
    </div>
    
    <!-- Быстрые круглые кнопки действий -->
    <div class="quick-actions-row">
        <button class="action-circle-btn" onclick="alert('Кошелёк в разработке')">
            <div class="icon-circle-bg">💵</div>
            <div class="action-btn-text">Кошелёк</div>
        </button>
        <button class="action-circle-btn" onclick="alert('Настройки в разработке')">
            <div class="icon-circle-bg">⚙️</div>
            <div class="action-btn-text">Настройки</div>
        </button>
        <button class="action-circle-btn" onclick="alert('Ссылка скопирована')">
            <div class="icon-circle-bg">🔗</div>
            <div class="action-btn-text">Поделиться</div>
        </button>
    </div>
    
    <!-- Вкладки объявлений -->
    <div class="tabs-container-row">
        <button class="tab-item-link tab-active" onclick="switchAdTab('active')">Активные</button>
        <button class="tab-item-link" onclick="switchAdTab('archive')">Архив</button>
    </div>
    
    <!-- Раздел объявлений -->
    <div class="ads-content-section">
        <div class="empty-ads-box">
            <div class="empty-box-icon">📦</div>
            <div class="empty-title">У вас пока нет активных объявлений</div>
            <div class="empty-desc">Нажмите кнопку ниже, чтобы быстро добавить ваше первое объявление на MyElon!</div>
            <button class="btn-create-ad-orange" onclick="window.location.href='create.html'">+ Создать объявление</button>
        </div>
    </div>
    
    <!-- Нижнее фиксированное меню -->
    <div class="bottom-nav-bar">
        <a href="index.html" class="nav-item-btn">
            <span class="nav-icon">🏠</span><span>Главная</span>
        </a>
        <a href="categories.html" class="nav-item-btn">
            <span class="nav-icon">📂</span><span>Категории</span>
        </a>
        <a href="create.html" class="nav-item-btn">
            <span class="nav-icon">➕</span><span>Создать</span>
        </a>
        <a href="chats.html" class="nav-item-btn">
            <span class="nav-icon">💬</span><span>Чат</span>
        </a>
        <a href="profile.html" class="nav-item-btn nav-active">
            <span class="nav-icon">👤</span><span>Профиль</span>
        </a>
    </div>

</div>

<script>
// Автоматически подтягиваем данные, которые сайт сохранил в память при регистрации
document.addEventListener("DOMContentLoaded", function() {
    let isLoggedIn = localStorage.getItem('isLoggedIn');
    let name = localStorage.getItem('userName') || "Пользователь";
    let customId = localStorage.getItem('userId') || "000001";
    
    // Если юзер не залогинен — силой гоним его регистрироваться в папку auth
    if (isLoggedIn !== 'true') {
        window.location.href = 'auth/phone.html';
        return;
    }
    
    // Подставляем Имя и ID в новые сочные блоки профиля
    document.getElementById('user-name-display').innerText = name;
    document.getElementById('user-id-display').innerText = "ID " + customId;
    
    // Вытаскиваем первую букву имени для круглой аватарки
    if (name.length > 0) {
        document.getElementById('user-avatar-letter').innerText = name.charAt(0).toUpperCase();
    }
});

// Твоя идеальная функция переключения вкладок через индексы (Исправлено!)
function switchAdTab(type) {
    let tabs = document.querySelectorAll('.tab-item-link');
    
    // Переключаем визуальный фокус между кнопками намертво
    tabs[0].className = type === 'active' ? 'tab-item-link tab-active' : 'tab-item-link';
    tabs[1].className = type === 'archive' ? 'tab-item-link tab-active' : 'tab-item-link';
    
    // Меняем контент на экране в зависимости от выбранного таба
    let adsBox = document.querySelector('.ads-content-section');
    if (type === 'active') {
        adsBox.innerHTML = `
            <div class="empty-ads-box">
                <div class="empty-box-icon">📦</div>
                <div class="empty-title">У вас пока нет активных объявлений</div>
                <div class="empty-desc">Нажмите кнопку ниже, чтобы быстро добавить ваше первое объявление на MyElon!</div>
                <button class="btn-create-ad-orange" onclick="window.location.href='create.html'">+ Создать объявление</button>
            </div>
        `;
    } else {
        adsBox.innerHTML = `
            <div class="empty-ads-box" style="border-color: #E5E7EB; background: #FAFAFA;">
                <div class="empty-box-icon" style="background: #E5E7EB;">📁</div>
                <div class="empty-title" style="color: #4B5563;">Архив пуст</div>
                <div class="empty-desc">Сюда будут попадать объявления, у которых закончился срок публикации или которые вы сняли с продажи.</div>
            </div>
        `;
    }
}

function handleLogoutUser() {
    // Железно стираем все ключи входа из памяти смартфона
    localStorage.clear();
    sessionStorage.clear();
    
    alert("Вы успешно вышли из профиля MyElon");
    
    // Моментально шлём пользователя на Шаг 1 авторизации в нашу новую папку
    window.location.href = 'auth/phone.html';
}
