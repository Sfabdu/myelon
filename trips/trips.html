<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyElon Попутчики — Найти поездку</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../supabase.js"></script>
    <style>
        body { background-color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .header-nav { width: 100%; max-width: 480px; background: #FFFFFF; padding: 16px; border-bottom: 1px solid #EAEAEA; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
        .btn-back { background: none; border: none; font-size: 20px; cursor: pointer; color: #333; padding: 0; }
        .header-title { font-size: 18px; font-weight: 800; color: #111; }
        .btn-orange-add { background: #FF6600; color: #FFFFFF; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
        
        .main-content { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; gap: 16px; }
        
        /* Блок фильтров городов */
        .filter-card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 20px; padding: 16px; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.01); }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .filter-select { background: #F3F4F6; border: 1px solid transparent; padding: 12px; border-radius: 12px; font-size: 14px; outline: none; font-weight: 600; color: #111; width: 100%; box-sizing: border-box; }
        .filter-select:focus { border-color: #FF6600; background: #FFFFFF; }
        .btn-search-trips { width: 100%; background: #111827; color: #FFFFFF; border: none; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
        
        /* Карточка поездки */
        .trip-card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 20px; padding: 16px; text-align: left; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.01); display: flex; flex-direction: column; gap: 12px; }
        .trip-top-row { display: flex; justify-content: space-between; align-items: center; }
        .trip-price { font-size: 20px; font-weight: 900; color: #FF6600; }
        .trip-seats-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #FFF0E6; color: #FF6600; }
        .trip-route { font-size: 15px; font-weight: 700; color: #111827; }
        .trip-details-row { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: #6B7280; font-weight: 500; }
        .detail-tag { background: #F3F4F6; padding: 4px 8px; border-radius: 8px; }
        .btn-book-orange { width: 100%; background: #FF6600; color: #FFFFFF; border: none; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    </style>
</head>
<body>

<div class="header-nav">
    <button class="btn-back" onclick="window.location.href='../index.html'">‹</button>
    <div class="header-title">MyElon Попутчики</div>
    <button class="btn-orange-add" onclick="window.location.href='create-trip.html'">+ Водитель</button>
</div>

<div class="main-content">
    <!-- Блок фильтрации рейсов -->
    <div class="filter-card">
        <div class="filter-grid">
            <select id="from-city" class="filter-select">
                <option value="">Откуда...</option>
                <option value="dushanbe">Душанбе</option>
                <option value="khujand">Худжанд</option>
                <option value="bokhtar">Бохтар</option>
                <option value="kulob">Куляб</option>
            </select>
            <select id="to-city" class="filter-select">
                <option value="">Куда...</option>
                <option value="dushanbe">Душанбе</option>
                <option value="khujand">Худжанд</option>
                <option value="bokhtar">Бохтар</option>
                <option value="kulob">Куляб</option>
            </select>
        </div>
        <button type="button" class="btn-search-trips" onclick="filterAvailableTrips()">Найти машины</button>
    </div>

    <div style="font-size: 14px; font-weight: 800; color: #111; text-align: left; margin-top: 8px;">Доступные поездки на сегодня</div>

    <!-- Список поездок -->
    <div id="trips-list-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
        
        <!-- Тестовая карточка поездки -->
        <div class="trip-card" data-from="dushanbe" data-to="khujand">
            <div class="trip-top-row">
                <div class="trip-price">120 TJS <span style="font-size:13px; color:#666; font-weight:500;">/ место</span></div>
                <div class="trip-seats-badge">Осталось 3 места</div>
            </div>
            <div class="trip-route">Душанбе ➔ Худжанд</div>
            <div class="trip-details-row">
                <div class="detail-tag">🕒 Выезд: 14:30</div>
                <div class="detail-tag">🚗 Opel Zafira</div>
                <div class="detail-tag">❄️ Кондиционер</div>
                <div class="detail-tag">💼 Багаж включен</div>
            </div>
            <button type="button" class="btn-book-orange" onclick="goToBookingDetails('000001', '120', 'dushanbe', 'khujand')">Забронировать место</button>
        </div>

    </div>
</div>

<script>
function filterAvailableTrips() {
    let from = document.getElementById('from-city').value;
    let to = document.getElementById('to-city').value;
    let cards = document.querySelectorAll('.trip-card');
    
    // Сверхлёгкий текстовый фильтр без перегрузки сервера
    cards.forEach(card => {
        let cardFrom = card.getAttribute('data-from');
        let cardTo = card.getAttribute('data-to');
        
        if ((from === "" || from === cardFrom) && (to === "" || to === cardTo)) {
            card.style.display = "flex";
        } else {
            card.style.display = "none";
        }
    });
}

function goToBookingDetails(driverId, price, from, to) {
    // Временно запоминаем детали в память, чтобы передать на страницу бронирования `book.html`
    sessionStorage.setItem('bookDriverId', driverId);
    sessionStorage.setItem('bookPrice', price);
    sessionStorage.setItem('bookRoute', from + " ➔ " + to);
    
    window.location.href = "book.html";
}
</script>
</body>
</html>
