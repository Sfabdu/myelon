<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация | MyElon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .auth-container { width: 100%; max-width: 400px; background: #FFFFFF; padding: 32px 24px; border-radius: 28px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); box-sizing: border-box; position: relative; }
        
        .btn-close-auth { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; color: #9CA3AF; }
        .auth-logo { font-size: 32px; font-weight: 900; color: #FF6600; text-align: center; margin-bottom: 8px; letter-spacing: -1px; }
        .auth-subtitle { font-size: 14px; color: #6B7280; text-align: center; margin-bottom: 24px; padding: 0 10px; line-height: 1.4; }
        
        /* Переключатель Вход / Регистрация 50/50 */
        .auth-tabs { display: flex; background-color: #F3F4F6; padding: 4px; border-radius: 12px; margin-bottom: 24px; }
        .auth-tab-btn { flex: 1; border: none; background: none; padding: 12px; font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; color: #6B7280; transition: all 0.2s ease; }
        .auth-tab-btn.active { background-color: #FFFFFF; color: #111827; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        
        /* Поля ввода */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; text-align: left; }
        .input-group label { font-size: 13px; font-weight: 700; color: #111827; }
        .input-group input, .input-group select { background-color: #F3F4F6; border: 1px solid transparent; padding: 14px; border-radius: 12px; font-size: 15px; outline: none; width: 100%; box-sizing: border-box; }
        .input-group input:focus, .input-group select:focus { border-color: #FF6600; background-color: #FFFFFF; }
        
        /* Блок профиля (для шага регистрации) */
        #register-extra-fields { display: none; }
        
        .btn-auth-submit { width: 100%; background-color: #FF6600; color: #FFFFFF; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 102, 0, 0.2); margin-top: 12px; transition: all 0.2s ease; }
        .btn-auth-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="auth-container">
    <button class="btn-close-auth" onclick="window.location.href='index.html'">✕</button>
    
    <div class="auth-logo">MyElon</div>
    <div class="auth-subtitle" id="auth-msg">Зайдите в свой личный профиль маркетплейса</div>
    
    <!-- Переключатель режима работы -->
    <div class="auth-tabs">
        <button id="tab-login" class="auth-tab-btn active" onclick="setMode('login')">Вход</button>
        <button id="tab-register" class="auth-tab-btn" onclick="setMode('register')">Регистрация</button>
    </div>
    
    <!-- Автоматическая форма -->
    <form onsubmit="handleAuth(event)">
        <div class="input-group">
            <label>Электронная почта (Email)</label>
            <input type="email" id="auth-email" placeholder="example@mail.com" required>
        </div>
        
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="auth-password" placeholder="Минимум 6 символов" required>
        </div>
        
        <!-- Дополнительные поля анкеты, которые откроются ТОЛЬКО при регистрации -->
        <div id="register-extra-fields">
            <div class="input-group">
                <label>Ваше имя</label>
                <input type="text" id="auth-name" placeholder="Как к вам обращаться?">
            </div>
            <div class="input-group">
                <label>Ваш город</label>
                <select id="auth-city">
                    <option value="dushanbe">Душанбе</option>
                    <option value="khujand">Худжанд</option>
                    <option value="bokhtar">Бохтар</option>
                </select>
            </div>
        </div>
        
        <button type="submit" id="btn-submit" class="btn-auth-submit">Войти в аккаунт</button>
    </form>
</div>

<script>
let currentMode = 'login';

function setMode(mode) {
    currentMode = mode;
    let extraFields = document.getElementById('register-extra-fields');
    let tabLogin = document.getElementById('tab-login');
    let tabRegister = document.getElementById('tab-register');
    let btnSubmit = document.getElementById('btn-submit');
    let msg = document.getElementById('auth-msg');
    
    if (mode === 'register') {
        extraFields.style.display = 'block';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        btnSubmit.innerText = 'Создать профиль и зайти';
        msg.innerText = 'Заполните анкету один раз для создания личного профиля';
        document.getElementById('auth-name').required = true;
    } else {
        extraFields.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        btnSubmit.innerText = 'Войти в аккаунт';
        msg.innerText = 'Зайдите в свой личный профиль маркетплейса';
        document.getElementById('auth-name').required = false;
    }
}

// Полностью автоматический вход без ручных кодов
function handleAuth(event) {
    event.preventDefault();
    
    let email = document.getElementById('auth-email').value.trim();
    let name = document.getElementById('auth-name').value.trim() || 'Пользователь';
    let city = document.getElementById('auth-city').value;
    
    // Стираем любые старые сессии Азиза на телефоне
    localStorage.clear();
    
    // Записываем данные того, кто реально заходит прямо сейчас
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('userEmail', email);
    localStorage.setItem('userName', currentMode === 'register' ? name : email.split('@')[0]);
    localStorage.setItem('userCity', city);
    
    alert(currentMode === 'register' ? 'Профиль успешно создан!' : 'Вы успешно вошли в систему!');
    
    // Мгновенно пускаем на сайт под собственным логином!
    window.location.href = 'index.html';
}
</script>

</body>
</html>
