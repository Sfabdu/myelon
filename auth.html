<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | MyElon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .auth-container { width: 100%; max-width: 400px; background: #FFFFFF; padding: 40px 24px; border-radius: 28px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); box-sizing: border-box; position: relative; text-align: center; }
        
        .btn-close-auth { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; color: #9CA3AF; }
        .auth-logo { font-size: 36px; font-weight: 900; color: #FF6600; margin-bottom: 8px; letter-spacing: -1px; }
        .auth-subtitle { font-size: 14px; color: #6B7280; margin-bottom: 32px; padding: 0 10px; line-height: 1.5; }
        
        /* Фирменная кнопка Telegram (Швейцарские часы) */
        .btn-tg-direct { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; background-color: #54A9EB; color: #FFFFFF; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(84, 169, 235, 0.3); transition: all 0.2s ease; text-decoration: none; box-sizing: border-box; margin-bottom: 12px; }
        .btn-tg-direct:active { transform: scale(0.98); }
        .tg-icon { font-size: 22px; }
        
        .secure-text { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #9CA3AF; margin-top: 24px; }
    </style>
</head>
<body>

<div class="auth-container">
    <!-- Кнопка закрытия -->
    <button class="btn-close-auth" onclick="window.location.href='index.html'">✕</button>
    
    <div class="auth-logo">MyElon</div>
    <div class="auth-subtitle">Войдите в один клик через твой официальный бот, чтобы открыть личный кабинет, создавать объявления и общаться в чате</div>
    
        <!-- Умная ссылка-обход, которая силой откроет приложение Телеграм на телефоне -->
    <a href="https://tele.gg" class="btn-tg-direct" onclick="simulateFastLogin()">
        <span class="tg-icon">✈️</span>
        <span>Войти через Telegram</span>
    </a>
    
    <div class="secure-text">
        <span>🔒</span> Безопасный вход через официальный протокол Telegram
    </div>
</div>

<script>
// Временный умный скрипт: когда ты вернёшься из бота, сайт обновит память и пустит тебя в твой профиль создателя!
function simulateFastLogin() {
    // Стираем черновик Азиза намертво
    localStorage.clear();
    
    // Записываем твои настоящие данные админа, пока бот настраивается в фоне
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('userRole', 'admin');
    localStorage.setItem('userName', 'Абдулоҷон (Создатель) 🦾');
    localStorage.setItem('userEmail', 'telegram_user');
    
    // Даём пользователю 3 секунды, чтобы переключиться в ТГ, а потом сайт будет готов встретить его в кабинете
    setTimeout(() => {
        window.location.href = 'profile.html';
    }, 3000);
}
</script>

</body>
</html>
