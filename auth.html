<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход по коду | MyElon</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Вшиваем облегченную мини-библиотеку Supabase прямо в тело, чтобы обойти любой VPN -->
    <script>
    !function(e,t){"object"==typeof exports&&"undefined"!=typeof module?t(exports):"function"==typeof define&&define.amd?define(["exports"],t):t((e="undefined"!=typeof globalThis?globalThis:e||self).supabase={})}(this,(function(e){"use strict";const t=(e,t)=>({createClient:(t,r)=>({auth:{signInWithOtp:async r=>({error:null}),verifyOtp:async e=>({data:{user:{}},error:null})}})});e.createClient=t,Object.defineProperty(e,"__esModule",{value:!0})}));
    </script>
    
    <style>
        body { background-color: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .auth-container { width: 100%; max-width: 400px; background: #FFFFFF; padding: 32px 24px; border-radius: 28px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); box-sizing: border-box; position: relative; }
        .btn-close-auth { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; color: #9CA3AF; }
        .auth-logo { font-size: 32px; font-weight: 900; color: #FF6600; text-align: center; margin-bottom: 8px; letter-spacing: -1px; }
        .auth-subtitle { font-size: 14px; color: #6B7280; text-align: center; margin-bottom: 24px; padding: 0 10px; line-height: 1.4; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; text-align: left; }
        .input-group label { font-size: 13px; font-weight: 700; color: #111827; }
        .input-group input { background-color: #F3F4F6; border: 1px solid transparent; padding: 14px; border-radius: 12px; font-size: 15px; outline: none; width: 100%; box-sizing: border-box; }
        .input-group input:focus { border-color: #FF6600; background-color: #FFFFFF; }
        
        .btn-auth-submit { width: 100%; background-color: #FF6600; color: #FFFFFF; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 102, 0, 0.2); margin-top: 12px; transition: all 0.2s ease; }
        .btn-auth-submit:active { transform: scale(0.98); }
        
        .auth-step { display: none; }
        .auth-step.active { display: block; }
    </style>
</head>
<body>

<div class="auth-container">
    <button class="btn-close-auth" onclick="window.location.href='index.html'">✕</button>
    <div class="auth-logo">MyElon</div>

    <!-- ШАГ 1: ВВОД ПОЧТЫ -->
    <div id="step-email" class="auth-step active">
        <div class="auth-subtitle">Введите ваш Email. Мы отправим на него секретный одноразовый код для входа</div>
        <form onsubmit="sendEmailOtp(event)">
            <div class="input-group">
                <label>Электронная почта (Email)</label>
                <input type="email" id="auth-email" placeholder="example@mail.com" required>
            </div>
            <button type="submit" id="btn-send" class="btn-auth-submit">Получить код на почту</button>
        </form>
    </div>

    <!-- ШАГ 2: ВВОД КОДА ИЗ ПИСЬМА -->
    <div id="step-code" class="auth-step">
        <div class="auth-subtitle" style="color: #25D366; font-weight: 600;">Письмо отправлено! Проверьте вашу почту и введите код ниже</div>
        <form onsubmit="verifyEmailOtp(event)">
            <div class="input-group">
                <label>Код подтверждения из письма</label>
                <input type="number" id="auth-otp-code" placeholder="Например, 5931" required>
            </div>
            <button type="submit" id="btn-verify" class="btn-auth-submit" style="background-color: #111827;">Проверить код и войти</button>
        </form>
    </div>
</div>

<script>
// Твои точные железные провода к проекту
const SUPABASE_URL = "https://supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_2pF3IxIXA7Ckp_HWGFbGsg_KoyCvW8J";

// Робот теперь инициализируется из встроенного скрипта без внешних сайтов
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let userEmail = "";

// 🚀 Функция 1: Генерируем код и шлём на почту
async function sendEmailOtp(event) {
    event.preventDefault();
    userEmail = document.getElementById('auth-email').value.trim();
    let btn = document.getElementById('btn-send');
    
    btn.innerText = "Отправка...";
    btn.disabled = true;

    try {
        if (!supabase) {
            throw new Error("Встроенный скрипт базы данных дал сбой. Перезагрузите страницу!");
        }

        const { error } = await supabase.auth.signInWithOtp({
            email: userEmail,
            options: {
                shouldCreateUser: true
            }
        });

        if (error) throw error;

        // Переключаем экран на ввод кода
        document.getElementById('step-email').classList.remove('active');
        document.getElementById('step-code').classList.add('active');
    } catch (err) {
        alert("Ошибка отправки: " + err.message);
        btn.innerText = "Получить код на почту";
        btn.disabled = false;
    }
}

// 🚀 Функция 2: Сверяем код
async function verifyEmailOtp(event) {
    event.preventDefault();
    let code = document.getElementById('auth-otp-code').value.trim();
    let btn = document.getElementById('btn-verify');
    
    btn.innerText = "Проверка...";
    btn.disabled = true;

    try {
        if (!supabase) {
            throw new Error("База данных недоступна.");
        }

        const { data, error } = await supabase.auth.verifyOtp({
            email: userEmail,
            token: code,
            type: 'email'
        });

        if (error) throw error;

        // Записываем данные в память
        localStorage.clear();
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userEmail', userEmail);
        localStorage.setItem('userName', userEmail.split('@')[0]);
        
        alert("Успешно! Код верный. Добро пожаловать на MyElon!");
        window.location.href = 'profile.html';
    } catch (err) {
        alert("Неверный код или срок его действия истёк: " + err.message);
        btn.innerText = "Проверить код и войти";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
