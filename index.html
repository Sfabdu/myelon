<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Подключаем наш один общий файл стилей -->

<body>

    <!-- 1. Шапка сайта (Только логотип, кнопку профиля убрали) -->
    <div class="header">
        <div class="logo">MyElon</div>
    </div>

    <!-- 2. ПОИСКОВИК КАК У АВИТО (Широкий, с фильтром 🎛️ внутри справа) -->
    <div class="search-section">
        <div class="search-container-avito">
            <span class="search-icon">🔍</span>
            <input type="text" id="main-search" placeholder="Поиск в MyElon" oninput="smartFilter()">
            <span class="search-filter-avito-btn" onclick="alert('Открываем шторку фильтров...')">🎛️</span>
        </div>
    </div>

    <!-- 3. ИДЕАЛЬНЫЙ РЯД КНОПОК: Переключатель + Категории (Можно листать пальцем вбок) -->
    <div class="categories-scroll-row">
        <!-- Наш переключатель: стал шире для удобного нажатия, но высота аккуратная -->
        <button class="smart-pill-toggle" id="market-mode-btn" onclick="handleMarketToggle()">
            <span id="toggle-text">Новые товары 🔄</span>
        </button>
        
        <!-- Дальше идут категории, которые система покажет как часто посещаемые -->
        <div class="category-pill" onclick="alert('Категория: Авто')">Авто</div>
        <div class="category-pill" onclick="alert('Категория: Электроника')">Электроника</div>
        <div class="category-pill" onclick="alert('Категория: Одежда')">Одежда</div>
    </div>

<!-- 4. РЯД ЧАСТО ПОСЕЩАЕМЫХ КАТЕГОРИЙ (Живая система в будущем сама заполнит этот ряд) -->
<div class="smart-user-categories" id="user-fav-categories">
    <!-- Сюда система потом сама подкинет нужные категории по вкусу человека -->
</div>

<script>
// Функция переключения режимов (Оранжевый / Тёмный)
function handleMarketToggle() {
    let btn = document.getElementById('market-mode-btn');
    let text = document.getElementById('toggle-text');
    
    // Переключаем класс
    btn.classList.toggle('bu-mode-active');
    
    if (btn.classList.contains('bu-mode-active')) {
        text.innerText = "Б/У товары 🔄";
    } else {
        text.innerText = "Новые товары 🔄";
    }
    
    // Сюда вечером прикрутим фильтрацию карточек товаров из Supabase
}
</script>

    <!-- 5. Лента товаров (Сетка) -->
    <div class="market-feed">
        <div class="mobile-grid">
            
            <!-- Товар 1 -->
            <div class="card" data-type="shop">
                <img src="https://unsplash.com" class="card-img" alt="Ноутбук">
                <div class="card-badge badge-shop">Магазин</div>

                    <div class="card-price">$1,200<span>TJS</span></div>

                    <div class="card-location">Душанбе</div>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="card" data-type="bu">
                <img src="https://unsplash.com" class="card-img" alt="Диван">
                <div class="card-badge badge-bu">Б/У</div>
                <div class="card-info">
                    <div class="card-price">$850<span>TJS</span></div>
                    <div class="card-title">Оранжевый диван из дуба</div>
                    <div class="card-location">Худжанд</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Идеальное нижнее меню навигации (5 кнопок) -->
<div class="nav-bar">

        <div class="nav-icon">🏠</div>

</div>

<script>
// Переключатель режимов Б/У и Магазины
function toggleMarketMode() {
    let btn = document.getElementById('toggle-mode');
    btn.classList.toggle('bu-active');
    if (btn.classList.contains('bu-active')) {
        btn.querySelector('span').innerText = "Показать новые товары";
    } else {
        btn.querySelector('span').innerText = "Показать Б/У вещи";
    }
}

// Умный алгоритм, который считает опечатки (Левенштейн)
function getLevenshteinDistance(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    let matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

// Живой умный фильтр для поиска
function smartFilter() {
    let query = document.getElementById('main-search').value.toLowerCase().trim();
    let cards = document.querySelectorAll('.card');

    if (query.length < 2) {
        cards.forEach(card => card.style.display = "block");
        return;
    }

    cards.forEach(card => {
        let title = card.querySelector('.card-title').innerText.toLowerCase();
        let words = title.split(" ");
        let isMatch = false;

        words.forEach(word => {
            if (word.includes(query) || query.includes(word)) {
                isMatch = true;
            }
            let distance = getLevenshteinDistance(query, word);
            if (distance <= 2) { 
                isMatch = true;
            }
        });

        if (isMatch) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
