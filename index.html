<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyElon | Маркетплейс Таджикистана</title>
    <!-- Подключаем наш один общий файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Шапка сайта -->
    <div class="header">
        <div class="logo">MyElon</div>
        <div class="header-menu">
            <button class="btn-profile-nav" onclick="window.location.href='profile.html'">👤 Профиль</button>
        </div>
    </div>

    <!-- 2. НАША НОВАЯ ПОИСКОВАЯ СИСТЕМА (То, чего не было в коде) -->
    <div class="search-section">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="main-search" placeholder="Поиск (найдёт даже с ошибками)..." oninput="smartFilter()">
        </div>
    </div>

    <!-- 3. Кнопка-переключатель Б/У и Магазины -->
    <button class="main-toggle" id="toggle-mode" onclick="toggleMarketMode()">
        <span>Показать Б/У вещи</span>
        <span>➔</span>
    </button>

    <!-- 4. Лента товаров (Сетка) -->
    <div class="market-feed">
        <div class="mobile-grid">
            
            <!-- Товар 1 -->
            <div class="card" data-type="shop">
                <img src="https://unsplash.com" class="card-img" alt="Ноутбук">
                <div class="card-badge badge-shop">Магазин</div>
                <div class="card-info">
                    <div class="card-price">$1,200<span>TJS</span></div>
                    <div class="card-title">Игровой ноутбук Core i7</div>
                    <div class="card-location">Душанбе</div>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="card" data-type="bu">
                <img src="https://unsplash.com" class="card-img" alt="Диван">
                <div class="card-badge badge-bu">Б/У</div>
                <div class="card-info">
                    <div class="card-price">$850<span>TJS</span></div>
                    <div class="card-title">Оранжевый диван из дуба</div>
                    <div class="card-location">Худжанд</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Идеальное нижнее меню навигации (5 кнопок) -->
<div class="nav-bar">
    <a href="index.html" class="nav-item active">
        <div class="nav-icon">🏠</div>
        <div>Главная</div>
    </a>
    <a href="#" class="nav-item" onclick="alert('Открываем Избранное...')">
        <div class="nav-icon">❤️</div>
        <div>Избранное</div>
    </a>
    <a href="#" class="nav-item nav-add-btn" onclick="alert('Переход к созданию объявления...')">
        <div class="nav-icon">➕</div>
        <div>Создать</div>
    </a>
    <a href="chat.html" class="nav-item">
        <div class="nav-icon">💬</div>
        <div>Чат</div>
    </a>
    <a href="profile.html" class="nav-item">
        <div class="nav-icon">👤</div>
        <div>Профиль</div>
    </a>
</div>

<script>
// Переключатель режимов Б/У и Магазины
function toggleMarketMode() {
    let btn = document.getElementById('toggle-mode');
    btn.classList.toggle('bu-active');
    if (btn.classList.contains('bu-active')) {
        btn.querySelector('span').innerText = "Показать новые товары";
    } else {
        btn.querySelector('span').innerText = "Показать Б/У вещи";
    }
}

// Умный алгоритм, который считает опечатки (Левенштейн)
function getLevenshteinDistance(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    let matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

// Живой умный фильтр для поиска
function smartFilter() {
    let query = document.getElementById('main-search').value.toLowerCase().trim();
    let cards = document.querySelectorAll('.card');

    if (query.length < 2) {
        cards.forEach(card => card.style.display = "block");
        return;
    }

    cards.forEach(card => {
        let title = card.querySelector('.card-title').innerText.toLowerCase();
        let words = title.split(" ");
        let isMatch = false;

        words.forEach(word => {
            if (word.includes(query) || query.includes(word)) {
                isMatch = true;
            }
            let distance = getLevenshteinDistance(query, word);
            if (distance <= 2) { 
                isMatch = true;
            }
        });

        if (isMatch) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
