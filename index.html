<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyElon | Маркетплейс</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Автономные стили для плавной анимации шторки фильтров -->
    <style>
        /* Черный полупрозрачный фон при открытии */
        .filter-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: flex;
            align-items: flex-end; /* Прижимает шторку к низу */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .filter-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Сама шторка фильтров */
        .filter-sheet {
            background-color: #FFFFFF;
            width: 100%;
            max-height: 85vh; /* Занимает 85% высоты экрана телефона */
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%); /* Прячется под экран */
            transition: transform 0.3s ease;
        }
        .filter-backdrop.open .filter-sheet {
            transform: translateY(0); /* Плавно вылетает вверх */
        }

        /* Шапка фильтров */
        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #F3F4F6;
        }
        .filter-header h3 { margin: 0; font-size: 18px; font-weight: 700; }
        .close-filter-btn { font-size: 20px; cursor: pointer; color: #111827; }
        .reset-filter-btn { font-size: 14px; color: #9CA3AF; cursor: pointer; }

        /* Контент внутри фильтров */
        .filter-body {
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 15px; font-weight: 700; color: #111827; }

        /* Стили полей выбора и ввода */
        .filter-group select, .price-input-row input {
            background-color: #F3F4F6;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        .price-input-row { display: flex; gap: 12px; }

        /* Переключатели продавцов */
        .seller-toggle-row {
            display: flex;
            background-color: #F3F4F6;
            padding: 4px;
            border-radius: 12px;
        }
        .seller-type-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            color: #4B5563;
        }
        .seller-type-btn.active {
            background-color: #FFFFFF;
            color: #111827;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* Кнопка в самом низу шторки */
        .filter-footer-btn-box { padding: 16px; border-top: 1px solid #F3F4F6; }
        .btn-apply-filters {
            width: 100%;
            background-color: #111827; /* Стильная черная кнопка как на Авито */
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. Шапка сайта -->
    <div class="header">
        <div class="logo">MyElon</div>
    </div>
    <!-- 2. ПОИСКОВИК КАК У АВИТО (Широкий, с фильтром 🎛️ внутри справа) -->
    <div class="search-section">
        <div class="search-container-avito">
            <span class="search-icon">🔍</span>
            <input type="text" id="main-search" placeholder="Поиск в MyElon" oninput="smartFilter()">
            <!-- Железная привязка вылета шторки -->
            <span class="search-filter-avito-btn" onclick="openFilterModal()">🎛️</span>
        </div>
    </div>

    <!-- 3. ДВЕ КНОПКИ РАЗДЕЛЕНЫ ПОПОЛАМ (50% на 50%) -->
    <div class="split-buttons-row">
        <!-- Левая половина: Переключатель режимов -->
        <button class="smart-pill-toggle" id="market-mode-btn" onclick="handleMarketToggle()">
            <span id="toggle-text">Новые товары 🔄</span>
        </button>
        
        <!-- Правая половина: Кнопка категорий -->
        <button class="category-pill-button" onclick="window.location.href='categories.html'">
            Категории 📁
        </button>
    </div>

    <!-- 4. Лента товаров (Сетка) -->
    <div class="market-feed">
        <div class="mobile-grid">
            <!-- Товар 1 -->
            <div class="card" data-type="shop">
                <img src="https://unsplash.com" class="card-img" alt="Ноутбук">
                <div class="card-badge badge-shop">Магазин</div>
                <div class="card-info">
                    <div class="card-price">$1,200<span>TJS</span></div>
                    <div class="card-title">Игровой ноутбук Core i7</div>
                    <div class="card-location">Душанбе</div>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="card" data-type="bu">
                <img src="https://unsplash.com" class="card-img" alt="Диван">
                <div class="card-badge badge-bu">Б/У</div>
                <div class="card-info">
                    <div class="card-price">$850<span>TJS</span></div>
                    <div class="card-title">Оранжевый диван из дуба</div>
                    <div class="card-location">Худжанд</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. ВЫЛЕТАЮЩАЯ ШТОРКА ФИЛЬТРОВ АВИТО -->
    <div id="filter-modal" class="filter-backdrop">
        <div class="filter-sheet">
            <!-- Шапка шторки -->
            <div class="filter-header">
                <span class="close-filter-btn" onclick="closeFilterModal()">✕</span>
                <h3>Фильтры</h3>
                <span class="reset-filter-btn" onclick="alert('Сбросить все фильтры')">Сбросить</span>
            </div>

           <!-- Тело фильтров -->
            <div class="filter-body">
                <!-- Блок 1: Сортировка -->
                <div class="filter-group">
                    <label>Сортировка</label>
                    <select id="filter-sort">
                        <option value="default">По умолчанию</option>
                        <option value="newest">Сначала новые</option>
                        <option value="cheap">Сначала дешевле</option>
                        <option value="expensive">Сначала дороже</option>
                    </select>
                </div>

                <!-- Блок 2: Где искать (Город) -->
                <div class="filter-group">
                    <label>Где искать</label>
                    <select id="filter-city">
                        <option value="all">Весь Таджикистан</option>
                        <option value="dushanbe">Душанбе</option>
                        <option value="khujand">Худжанд</option>
                    </select>
                </div>

                <!-- Блок 3: Радиус поиска -->
                <div class="filter-group">
                    <label>Радиус поиска</label>
                    <select id="filter-radius">
                        <option value="0">Только в этом месте</option>
                        <option value="1">+ 1 км</option>
                        <option value="5">+ 5 км</option>
                        <option value="10">+ 10 км</option>
                        <option value="50">+ 50 км</option>
                    </select>
                </div>

                <!-- Блок 4: Цена -->
                <div class="filter-group">
                    <label>Цена, TJS</label>
                    <div class="price-input-row">
                        <input type="number" id="price-from" placeholder="от">
                        <input type="number" id="price-to" placeholder="до">
                    </div>
                </div>

                <!-- Блок 5: Продавцы -->
                <div class="filter-group">
                    <label>Продавцы</label>
                    <div class="seller-toggle-row">
                        <button class="seller-type-btn active" onclick="setSellerType(this)">Все</button>
                        <button class="seller-type-btn" onclick="setSellerType(this)">Частные</button>
                        <button class="seller-type-btn" onclick="setSellerType(this)">Компании</button>
                    </div>
                </div>
            </div>


            <!-- Финальная кнопка шторки -->
            <div class="filter-footer-btn-box">
                <button class="btn-apply-filters" onclick="closeFilterModal()">Показать объявления</button>
            </div>
        </div>
    </div>

    <!-- 6. Стабильное нижнее меню навигации (5 кнопок) -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div>Главная</div>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon">📁</div>
            <div>Категории</div>
        </a>  
            <a href="add-item.html" class="nav-item nav-add-btn">
        <div class="nav-icon">➕</div>
        <div>Создать</div>
    </a>
        <a href="profile.html" class="nav-item">
            <div class="nav-icon">💬</div>
            <div>Чат</div>
        </a>
        <a href="auth.html" class="nav-item">
            <div class="nav-icon">👤</div>
            <div>Профиль</div>
        </a>
    </div>

<script>
// 1. Переключатель Новые / БУ
function handleMarketToggle() {
    let btn = document.getElementById('market-mode-btn');
    let text = document.getElementById('toggle-text');
    btn.classList.toggle('bu-mode-active');
    if (btn.classList.contains('bu-mode-active')) {
        text.innerText = "Б/У товары";
    } else {
        text.innerText = "Новые товары";
    }
}

// 2. Управление шторкой фильтров
function openFilterModal() {
    document.getElementById('filter-modal').classList.add('open');
}
function closeFilterModal() {
    document.getElementById('filter-modal').classList.remove('open');
}
function setSellerType(btn) {
    document.querySelectorAll('.seller-type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

// 3. Умный поиск товаров
function smartFilter() {
    let query = document.getElementById('main-search').value.toLowerCase().trim();
    let cards = document.querySelectorAll('.card');
    if (query.length < 2) {
        cards.forEach(card => card.style.display = "block");
        return;
    }
    cards.forEach(card => {
        let title = card.querySelector('.card-title').innerText.toLowerCase();
        if (title.includes(query)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>
</body>
</html>
