<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | MyElon</title>
    <!-- Подключаем наш один общий файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <div class="logo-box">
        <span class="logo-text">MyElon</span>
    </div>
    <div class="subtitle">Безопасный вход через официальный Telegram</div>

    <!-- Виджет авторизации Telegram -->
    <div class="tg-widget-container">
        <script async src="https://telegram.org" 
                data-telegram-login="myelon_auth_bot" 
                data-size="large" 
                data-radius="16" 
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write"></script>
    </div>

    <div class="footer-text">
        Авторизуясь, вы подтверждаете согласие с правилами маркетплейса MyElon.
    </div>
</div>

<script>
    function onTelegramAuth(user) {
        alert('Салом, ' + user.first_name + '! Твой ID: ' + user.id);
        localStorage.setItem('tg_user', JSON.stringify(user));
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
