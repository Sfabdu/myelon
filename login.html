<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | myelon.tj</title>
    <!-- Подключаем наш общий файл краски, который мы уже создали -->
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Премиальный минимализм специально для экрана входа */
        body {
            background-color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-box {
            width: 64px;
            height: 64px;
            background-color: #FF6600;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.2);
        }
        .logo-text {
            color: #FFFFFF;
            font-size: 32px;
            font-weight: bold;
        }
        h2 {
            font-size: 24px;
            color: #111827;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        p {
            font-size: 14px;
            color: #6B7280;
            margin: 0 0 32px 0;
        }
        /* Удобные кнопки входа для Таджикистана */
        .auth-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .btn-tg {
            background-color: #229ED9;
            color: #FFFFFF;
        }
        .btn-wa {
            background-color: #25D366;
            color: #FFFFFF;
        }
        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Логотип супераппа -->
        <div class="logo-box">
            <span class="logo-text">M</span>
        </div>
        
        <h2>Вход на платформу</h2>
        <p>Выберите удобный способ для мгновенного входа без ожидания СМС-кодов</p>

        <!-- Кнопки входа -->
        <button class="auth-btn btn-tg" onclick="startTelegramAuth()">
            <span>🔵 Войти за 1 секунду через Telegram</span>
        </button>

        <button class="auth-btn btn-wa" onclick="startWhatsAppAuth()">
            <span>🟢 Войти просто через WhatsApp</span>
        </button>

        <div class="secure-badge">
            🔒 Безопасность под защитой протоколов шифрования
        </div>
    </div>

    <script>
        function startTelegramAuth() {
            alert("Запускаем безопасный мост с Telegram-ботом...");
            // Сюда на выходных привяжем токен бота
        }

        function startWhatsAppAuth() {
            alert("Генерируем проверочный код для WhatsApp...");
            // Сюда привяжем бесплатную отправку
        }
    </script>
</body>
</html>
