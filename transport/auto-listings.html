<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Объявления по маркам — myelon.tj</title>
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../assets/app.js" defer></script>
    <style>
      /* Стили для карточек объявлений, как на картинке */
      .market-feed.mobile-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Два столбца */
        gap: 16px; /* Расстояние между карточками */
        padding: 16px;
      }

      .ad-card {
        background: #fff;
        border-radius: 16px; /* Сильное закругление */
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); /* Легкая тень */
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease;
      }

      .ad-card:hover {
        transform: translateY(-35px); /* Легкий эффект при наведении */
      }

      .ad-image-container {
        width: 100%;
        height: 140px; /* Фиксированная высота фото */
        background-color: #f1f5f9; /* Фон, пока фото грузится */
      }

      .ad-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Фото заполняет контейнер */
      }

      .ad-details {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .ad-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .tag-shop {
        background-color: #fff7ed; /* Оранжевый фон */
        color: #ea580c; /* Оранжевый текст */
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .ad-price {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
      }

      .ad-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: #0f172a;
        margin: 0;
      }

      .ad-location {
        font-size: 12px;
        color: #64748b;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="page-shell mobile-shell">
      <header class="topbar compact-topbar">
        <a class="back-button" href="auto-brands.html" title="Назад к маркам">←</a>
        <a class="brand" href="../index.html" aria-label="myelon.tj home">
          <span class="brand-mark">E</span>
          <span class="brand-text">
            <strong>myelon.tj</strong>
            <small id="brandSubtitle">Автомобили</small>
          </span>
        </a>
      </header>

      <main class="content-stack">
        <section class="section-block">
          <div class="section-heading">
            <h2 id="listingsTitle">Объявления</h2>
            <span id="listingsCount">В наличии</span>
          </div>

          <!-- Лента объявлений с новым дизайном -->
          <div class="market-feed mobile-grid" id="brandListingsFeed">
            
            <!-- Карточка 1 -->
            <a href="auto-detail.html" class="ad-card">
              <div class="ad-image-container">
                <img src="https://images.unsplash.com/photo-1617531653332-bd46c24f2068?q=80&w=400&auto=format&fit=crop" alt="Toyota" />
              </div>
              <div class="ad-details">
                <div class="ad-meta">
                  <span class="tag-shop">Магазин</span>
                  <span class="ad-price">145,000 TJS</span>
                </div>
                <h3 class="ad-title">Новый Toyota Corolla 2021</h3>
                <p class="ad-location">Авторынок Душанбе</p>
              </div>
            </a>

            <!-- Карточка 2 -->
            <a href="auto-detail.html" class="ad-card">
              <div class="ad-image-container">
                <img src="https://images.unsplash.com/photo-1563720223185-6142f3a8d18e?q=80&w=400&auto=format&fit=crop" alt="Toyota" />
              </div>
              <div class="ad-details">
                <div class="ad-meta">
                  <span class="tag-shop">Магазин</span>
                  <span class="ad-price">310,000 TJS</span>
                </div>
                <h3 class="ad-title">Toyota Camry XV70, 2020</h3>
                <p class="ad-location">Душанбе, центр</p>
              </div>
            </a>

          </div>
        </section>
      </main>

      <nav class="mobile-tabbar" aria-label="Нижняя навигация">
        <a href="../index.html" class="tab-item">🏠<span>Главная</span></a>
        <a href="../categories.html" class="tab-item active">📁<span>Категории</span></a>
        <a href="#" class="tab-item center-tab">🔍</a>
        <a href="#" class="tab-item">❤️<span>Избранное</span></a>
        <a href="../profile.html" class="tab-item">👤<span>Профиль</span></a>
      </nav>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const brand = urlParams.get('brand') || 'Авто';
      const formattedBrand = brand.charAt(0).toUpperCase() + brand.slice(1);
      document.getElementById('listingsTitle').textContent = `Объявления: ${formattedBrand}`;
      document.getElementById('brandSubtitle').textContent = formattedBrand;
    </script>
  </body>
</html>
